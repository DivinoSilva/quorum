openapi: 3.0.3
info:
  title: Quorum API
  version: v1
  description: Generic vote-tallying API — two candidates, unlimited votes per person, real-time results.
paths:
  /candidates:
    get:
      summary: List the two voting options
      tags:
        - Candidates
      responses:
        '200':
          description: candidates
          content:
            application/json:
              schema:
                type: object
                properties:
                  candidates:
                    type: array
                    items:
                      $ref: '#/components/schemas/Candidate'
  /votes:
    post:
      summary: Cast a vote
      tags:
        - Votes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                candidate_id:
                  type: integer
              required:
                - candidate_id
      responses:
        '201':
          description: vote recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  vote:
                    type: object
                    properties:
                      id:
                        type: integer
                      candidate_id:
                        type: integer
                  results:
                    $ref: '#/components/schemas/Results'
        '404':
          description: candidate not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '429':
          description: too many votes from this IP in a short window (Rack::Attack throttle)
  /results:
    get:
      summary: Current totals, cached for 2 seconds
      tags:
        - Results
      responses:
        '200':
          description: results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Results'
  /results/hourly:
    get:
      summary: Vote totals grouped by hour
      tags:
        - Results
      responses:
        '200':
          description: hourly totals
          content:
            application/json:
              schema:
                type: object
                properties:
                  hours:
                    type: array
                    items:
                      type: object
                      properties:
                        hour:
                          type: string
                          format: date-time
                        total:
                          type: integer
  /metrics:
    get:
      summary: Prometheus exposition format
      tags:
        - Observability
      responses:
        '200':
          description: metrics
          content:
            text/plain:
              schema:
                type: string
  /up:
    get:
      summary: Health check
      tags:
        - Observability
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
components:
  schemas:
    Candidate:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        photo_url:
          type: string
          nullable: true
    Results:
      type: object
      properties:
        total_votes:
          type: integer
        candidates:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              votes:
                type: integer
              percentage:
                type: number
servers:
  - url: http://localhost:3000
