openapi: 3.0.3
info:
  title: Quorum API
  version: v1
  description: Generic vote-tallying API — two candidates, unlimited votes per person, real-time results.
paths:
  /candidates:
    get:
      summary: List the two voting options
      tags:
        - Candidates
      responses:
        '200':
          description: candidates
          content:
            application/json:
              schema:
                type: object
                properties:
                  candidates:
                    type: array
                    items:
                      $ref: '#/components/schemas/Candidate'
  /votes:
    post:
      summary: Cast a vote
      tags:
        - Votes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                candidate_id:
                  type: integer
              required:
                - candidate_id
      responses:
        '201':
          description: vote recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  vote:
                    type: object
                    properties:
                      id:
                        type: integer
                      candidate_id:
                        type: integer
                  results:
                    $ref: '#/components/schemas/Results'
        '404':
          description: candidate not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '429':
          description: too many votes from this IP in a short window (Rack::Attack throttle)
  /results:
    get:
      summary: Vote totals — current snapshot, or grouped by hour via query params
      description: >
        With no query params, returns the live total and per-candidate breakdown
        (cached for 2 seconds). Pass `group_by=hour` to instead get that day's
        votes broken into 24 hourly buckets — the period is a filter on this same
        resource, not a separate endpoint.
      tags:
        - Results
      parameters:
        - name: group_by
          in: query
          required: false
          description: Set to `hour` to receive the hourly breakdown instead of the live snapshot.
          schema:
            type: string
            enum: [hour]
        - name: date
          in: query
          required: false
          description: Only used with group_by=hour. Day to query, YYYY-MM-DD. Defaults to today.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: results
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Results'
                  - $ref: '#/components/schemas/HourlyResults'
        '400':
          description: unsupported group_by, or malformed date
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /metrics:
    get:
      summary: Prometheus exposition format
      tags:
        - Observability
      responses:
        '200':
          description: metrics
          content:
            text/plain:
              schema:
                type: string
  /up:
    get:
      summary: Health check
      tags:
        - Observability
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
components:
  schemas:
    Candidate:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        photo_url:
          type: string
          nullable: true
    Results:
      type: object
      properties:
        total_votes:
          type: integer
        candidates:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              photo_url:
                type: string
                nullable: true
              votes:
                type: integer
              percentage:
                type: number
    HourlyResults:
      type: object
      properties:
        date:
          type: string
          format: date
        hours:
          type: array
          items:
            type: object
            properties:
              hour:
                type: string
                format: date-time
              total:
                type: integer
              candidates:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    votes:
                      type: integer
servers:
  - url: http://localhost:3000
